mod.id = "musicboxradio"
mod.name = "MusicBox Radio"
mod.group = "com.musicbox"
mod.version = "1.2.1"
mod.authors = "Bryce"
mod.license = "All Rights Reserved"
mod.description = "Stream real internet radio in Minecraft.\nPlace a music box, pick a station, and everyone nearby hears the same thing. Pair headphones to keep listening in full stereo anywhere you go."

