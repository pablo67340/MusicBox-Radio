plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = "${minecraft_version}-neoforge-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            // Left to itself the JVM sizes the heap at a quarter of system RAM, which on a
            // large machine reserves far more than a test client ever touches and leaves it
            // fighting everything else for native memory.
            jvmArgument '-Xmx3G'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Merge resources into the classes dir so the dev-time mod loader sees one
// directory containing both neoforge.mods.toml and the classes
sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory

repositories {
    mavenCentral()
}

// Plain libraries that get unpacked into the mod's output. JLayer is a pure-Java MP3
// decoder with no transitive dependencies, so a flat merge is enough - no relocation
// machinery required. Compile-only: on the runtime classpath too, the loader would turn the
// jar into a second module exporting the same packages as the unpacked copy and refuse to boot.
configurations {
    shipped
    compileOnly.extendsFrom shipped
}

dependencies {
    shipped "javazoom:jlayer:${jlayer_version}"
}

var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Unpack into the mod's own classes directory rather than merging at jar time. Dev runs boot
// from that directory, and the mod classloader cannot reach a plain classpath library, so
// merging only in the jar leaves the dev client throwing NoClassDefFoundError on the decoder thread.
tasks.register('extractShipped', Copy) {
    dependsOn tasks.named('compileJava')
    from { configurations.shipped.collect { it.isDirectory() ? it : zipTree(it) } }
    into sourceSets.main.java.classesDirectory
    exclude 'META-INF/**', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('classes').configure {
    dependsOn 'extractShipped'
}

tasks.named('jar', Jar).configure {
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
